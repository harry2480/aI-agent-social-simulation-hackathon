name: Verify

on:
  # ブランチを限定すると develop 向け PR で起動せず、品質ゲートが素通りする。
  # 全 PR を対象にする
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint・型チェック・Unit テスト・依存方向チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint → prisma generate → typecheck → unit test → depcruise
      - run: pnpm verify
