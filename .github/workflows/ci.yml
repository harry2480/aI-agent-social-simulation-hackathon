name: Build

# pnpm verify では next build までは確認できないため、
# 本番ビルドが通ることを独立して検証する。
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 本番ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prisma generate + next build。DB へは接続しないため接続情報は不要
      - run: pnpm build
