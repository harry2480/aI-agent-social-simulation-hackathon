# Codecov 設定（テンプレート）
# 詳細: https://docs.codecov.com/docs/codecov-yaml
codecov:
  branch: develop

coverage:
  status:
    # プロジェクト全体のカバレッジ
    project:
      default:
        target: auto        # 直近のベースより下がらなければ OK
        threshold: 1%       # 1% までの低下は許容
    # この PR/コミットで変更された行のカバレッジ
    patch:
      default:
        target: 80%
        threshold: 0%

# 計測対象から除外するパス。vitest.config.ts の coverage.exclude と揃える。
# 除外するのは Unit テストで到達できないものだけに限る。
ignore:
  - "**/*.test.ts"
  - "**/*.d.ts"
  - "apps/webapp/test/**"
  - "apps/webapp/prisma/**"
  - "apps/webapp/scripts/**"
  - "apps/webapp/*.config.*"
  # 実行コードを持たない型・interface のみのファイル
  - "apps/webapp/src/backend/domain/repositories/**"
  - "apps/webapp/src/backend/domain/gateways/ai-decision.gateway.ts"
  - "apps/webapp/src/backend/domain/models/metrics.model.ts"
  - "apps/webapp/src/backend/domain/models/result.model.ts"
  # DB 接続が必要。Integration テストの担当（docs/テストガイドライン.md）
  - "apps/webapp/src/backend/infrastructure/db/**"
  - "apps/webapp/src/backend/infrastructure/repositories/**"
  - "apps/webapp/src/backend/presentation/composition/simulation.composition.ts"
  - "apps/webapp/src/backend/presentation/loaders/**"
  - "apps/webapp/src/backend/presentation/actions/**"
  # ブラウザ描画が必要。E2E の担当
  - "apps/webapp/src/app/**"
  - "apps/webapp/src/frontend/components/**"
  - "apps/webapp/src/frontend/hooks/**"

# PR にカバレッジコメントを投稿
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
